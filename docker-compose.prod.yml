# Production stack: Caddy TLS reverse proxy -> frontend + backend, PostgreSQL for persistence.
# Qdrant stays on Qdrant Cloud (QDRANT_URL / QDRANT_API_KEY in .env.production).
# Usage:
#   cp .env.production.example .env.production
#   # edit .env.production (API_KEY, POSTGRES_PASSWORD, DOMAIN, GEMINI_API_KEY, ...)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env.production}
    depends_on:
      - web
      - api

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN:?}
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://ysg:${POSTGRES_PASSWORD:?}@db:5432/ysg
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_data:/app/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ysg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=ysg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ysg -d ysg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  api_data:
  caddy_data:
  caddy_config:
